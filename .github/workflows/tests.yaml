name: Keycloak Tests

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-image:
    # The image this repo builds (Keycloak + the NetEye theme + the three
    # providers) is built ONCE here and shared by the two test jobs below, so a
    # PR never builds it more than once. push: false uploads it as an artifact
    # (neteye-keycloak-image/image.tar) instead of publishing to GHCR.
    permissions:
      contents: read
      packages: write
    uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@7742c5e2a5092511fef6e00e2872f278f5f2bf36 # main
    secrets: inherit
    with:
      working-directory: .
      dockerfile-path: ./Dockerfile
      image-name: ${{ github.event.repository.name }}
      push: false

  theme-tests:
    name: Run theme tests
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Download built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-image
          path: ${{ runner.temp }}/

      - name: Load built image
        run: |
          docker load -i ${{ runner.temp }}/image.tar
          docker tag "$(docker images -q | head -1)" localhost/neteye-keycloak:test

      - name: Start Keycloak + Mailpit harness
        run: docker compose -f compose.test.yaml up -d
        working-directory: tests

      - name: Wait for Keycloak to accept requests
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/auth/realms/neteye-test >/dev/null 2>&1; then
              echo "Keycloak ready after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak did not become ready in time"
          docker compose -f compose.test.yaml logs
          exit 1
        working-directory: tests

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run theme tests
        run: npx playwright test -c playwright.theme.config.ts
        working-directory: tests/e2e

      - name: Fail on any FreeMarker or template errors
        # Covers render paths the specs do not open directly (for example the
        # select-authenticator template): any theme template that fails to
        # parse or render while Keycloak is serving these requests fails the
        # run instead of silently degrading to the default look.
        run: |
          if docker compose -f compose.test.yaml logs keycloak-test 2>&1 \
            | grep -Ei 'freemarker|failed to process template|template .* not found|could not find template'; then
            echo "::error::Keycloak reported a theme/template error, see logs above"
            exit 1
          fi
          echo "No FreeMarker or template errors detected"
        working-directory: tests

      - name: Tear down the test harness
        if: always()
        run: docker compose -f compose.test.yaml down -v
        working-directory: tests

  plugin-tests:
    # The built image against the MariaDB it ships with: does it boot
    # --optimized, and do the providers work? Needs a real DB, so it is gated
    # to its own job.
    name: Run plugin tests
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Download built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-image
          path: ${{ runner.temp }}/

      - name: Load built image
        run: |
          docker load -i ${{ runner.temp }}/image.tar
          docker tag "$(docker images -q | head -1)" localhost/neteye-keycloak:test

      - name: Start the plugin harness
        run: docker compose -f compose.plugin.yaml up -d
        working-directory: tests/plugin

      - name: Wait for the plugin realm to accept requests
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/auth/realms/plugin-test/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "Keycloak ready after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak did not become ready in time"
          docker compose -f compose.plugin.yaml logs
          exit 1
        working-directory: tests/plugin

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run plugin tests
        run: npx playwright test -c playwright.plugin.config.ts
        working-directory: tests/e2e

      - name: Tear down the plugin harness
        if: always()
        run: docker compose -f compose.plugin.yaml down -v
        working-directory: tests/plugin
