# NetEye runs Keycloak on a MariaDB Galera cluster, where a node can serve a
# read that does not yet include a write already committed cluster-wide;
# wsrep_sync_wait=1 makes every read wait for the node to catch up. Keycloak
# has no native option for a connection-init statement, hence the raw Quarkus
# property. It is a runtime property, read on every start, and a deployment can
# override it with QUARKUS_DATASOURCE_JDBC_NEW_CONNECTION_SQL. On a single-node
# MariaDB the statement is accepted and does nothing.
quarkus.datasource.jdbc.new-connection-sql=SET SESSION wsrep_sync_wait=1
