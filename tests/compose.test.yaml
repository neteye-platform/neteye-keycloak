# Theme test harness.
#
# Runs the IMAGE THIS REPOSITORY BUILDS (localhost/neteye-keycloak:test, i.e.
# Keycloak plus the NetEye theme baked in, plus the four providers) against
# the same MariaDB it ships with, importing the theme test realm from
# tests/realm-test.json. The theme is exercised the way it ships: baked into
# the image, not mounted.
#
#   docker build -t localhost/neteye-keycloak:test .   # from repo root
#   docker compose -f tests/compose.test.yaml up -d
#   ... run Playwright against http://localhost:8080/auth (mailpit API on :8025)

services:
  mariadb:
    image: docker.io/library/mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: keycloak
      MARIADB_USER: keycloak
      MARIADB_PASSWORD: keycloak
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: docker.io/axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "8025:8025"

  keycloak-test:
    image: localhost/neteye-keycloak:test
    depends_on:
      mariadb:
        condition: service_healthy
    command:
      - start
      - --import-realm
    volumes:
      - ./realm-test.json:/opt/keycloak/data/import/realm-test.json:ro
    environment:
      KC_DB: mariadb
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
