# Plugin compatibility harness: runs the image this repo builds
# (localhost/neteye-keycloak:test, i.e. Keycloak + the four NetEye providers)
# against the same MariaDB it ships with. The theme harness
# (tests/compose.test.yaml) stays separate: it is cheap and covers only the theme.
#
# The login-sync receiver is a host-side mock (:9099) started by the
# Playwright webServer; the `localhost -> host-gateway` mapping below is
# how the container reaches it.
#
#   docker build -t localhost/neteye-keycloak:test .   # from repo root
#   docker compose -f tests/plugin/compose.plugin.yaml up -d
#   ... plugin specs run against http://localhost:8081/auth

services:
  mariadb:
    image: docker.io/library/mariadb:12.3.2@sha256:c237fd50cc48d6f2b87c4ca66d52f3b5eef7271b3bea7aee586c0be19d5b460d
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: keycloak
      MARIADB_USER: keycloak
      MARIADB_PASSWORD: keycloak
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-plugin:
    image: localhost/neteye-keycloak:test
    depends_on:
      mariadb:
        condition: service_healthy
    extra_hosts:
      # The brokered login targets this same instance as its upstream IdP, so
      # the server must reach itself by the SAME host (:8081) as the browser,
      # or Keycloak (KC_HOSTNAME_STRICT=false) derives mismatched issuers.
      # localhost -> host-gateway forwards :8081 back into the container :8080.
      - "localhost:host-gateway"
    command:
      - start
      - --optimized
      - --import-realm
    volumes:
      - ./realm-plugins.json:/opt/keycloak/data/import/realm-plugins.json:ro
      - ./realm-upstream.json:/opt/keycloak/data/import/realm-upstream.json:ro
    environment:
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # login-sync provider SPI (the double underscore after AUTHENTICATOR
      # is mandatory: the single-underscore form does not resolve).
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SERVICE_ENDPOINT: "http://localhost:9099/sync"
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_CLIENT_ID: "login-sync-sa"
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_CLIENT_SECRET: "login-sync-test-secret"
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_TOKEN_ENDPOINT: "http://localhost:8081/auth/realms/plugin-test/protocol/openid-connect/token"
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__HTTP_TIMEOUT_MS: "5000"
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__ALLOW_INSECURE_HTTP: "true"
    ports:
      - "8081:8080"
