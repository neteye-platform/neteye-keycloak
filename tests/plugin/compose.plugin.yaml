# Plugin compatibility harness: runs the image this repo builds
# (localhost/neteye-keycloak:test, i.e. Keycloak + the three NetEye providers)
# against the same MariaDB it ships with. The theme harness
# (tests/compose.test.yaml) stays separate: it is cheap and covers only the theme.
#
#   docker build -t localhost/neteye-keycloak:test .   # from repo root
#   docker compose -f tests/plugin/compose.plugin.yaml up -d
#   ... plugin specs run against http://localhost:8081/auth

services:
  mariadb:
    image: docker.io/library/mariadb:12.3.2@sha256:c237fd50cc48d6f2b87c4ca66d52f3b5eef7271b3bea7aee586c0be19d5b460d
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: keycloak
      MARIADB_USER: keycloak
      MARIADB_PASSWORD: keycloak
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-plugin:
    image: localhost/neteye-keycloak:test
    depends_on:
      mariadb:
        condition: service_healthy
    extra_hosts:
      # The brokered login targets this same instance as its upstream IdP, so
      # the server must reach itself by the SAME host (:8081) as the browser,
      # or Keycloak (KC_HOSTNAME_STRICT=false) derives mismatched issuers.
      # localhost -> host-gateway forwards :8081 back into the container :8080.
      - "localhost:host-gateway"
    command:
      - start
      - --optimized
      - --import-realm
    volumes:
      - ./realm-plugins.json:/opt/keycloak/data/import/realm-plugins.json:ro
      - ./realm-upstream.json:/opt/keycloak/data/import/realm-upstream.json:ro
    environment:
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
